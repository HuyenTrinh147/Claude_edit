[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vedit"
version = "0.1.0"
description = "Hệ thống 3 agent: nghiên cứu kỹ thuật edit, lên kịch bản video ngắn theo trend, dựng & xuất video bằng ffmpeg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "yt-dlp>=2025.1.1",
    "pillow>=10.1",     # measuring text to size stickers / callouts
    "fonttools>=4.40",  # reading font metrics so `size` looks the same in every font
    "gdown>=5.2",       # Google Drive folders (SFX packs, footage) when the network allows drive.google.com
]

[project.optional-dependencies]
# Google Drive: tạo thư mục dự án + upload kịch bản
gdrive = [
    "google-api-python-client>=2.100",
    "google-auth>=2.25",
    "google-auth-oauthlib>=1.2",
]
# Chuyển giọng nói thành chữ (phụ đề tự động, cắt khoảng lặng theo lời thoại)
transcribe = ["faster-whisper>=1.0"]
# Bám vật (object tracking) để HUD / đồ hoạ dính vào vật thật: `vedit track`
track = ["opencv-contrib-python-headless>=4.9"]
dev = ["pytest>=8"]

[project.scripts]
vedit = "vedit.cli:main"

[tool.setuptools.packages.find]
include = ["vedit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
